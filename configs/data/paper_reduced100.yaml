dataset_path: data_proc/grmhd_regrid_inner_r200_64.h5
protocol_name: paper_reduced100_press_spherical_ks

source_snapshot_start: 11
source_snapshot_end: 111
train_snapshot_start: 11
train_snapshot_end: 91
validation_snapshot_start: 91
validation_snapshot_end: 111
stride: 1

thermal_channel: press
paper_adaptation: true
eos_conversion: disabled_unverified_gamma
spherical_ks_adaptation: true
coordinate_system: "spherical Kerr-Schild: phi,theta,r"
channel_order: [Bcc1, Bcc2, Bcc3, rho, press, vel1, vel2, vel3]

expected_upstream_commit: 86a8bc7812a31b42c4f7895693cf4ac11521c066

preprocessing:
  transforms:
    Bcc1: signed_log
    Bcc2: signed_log
    Bcc3: signed_log
    rho: positive_log
    press: positive_log
    vel1: linear
    vel2: linear
    vel3: linear
  gamma: 6.0
  inverse_clamp_fraction: 0.99
  mad_multiplier: 1.4826
  min_scale: 1.0e-6
  invalid_epsilon_fallback: 1.0e-30
  decode_finite_guard: output_dtype_max_after_paper_inverse_clamp
  decode_finite_guard_is_adaptation: true
  fit_scope: all_train_voxels
  fit_split: train

outputs:
  root: outputs/paper_reduced100
  manifest_json: outputs/paper_reduced100/manifest.json
  manifest_csv: outputs/paper_reduced100/manifest.csv
  stats_dir: outputs/paper_reduced100/stats
  preprocessing_audit_json: outputs/paper_reduced100/preprocessing_audit.json
  preprocessing_audit_markdown: outputs/paper_reduced100/preprocessing_audit.md
