stage: S
classification: adapted_method_data_scarcity_audit
comparison_parent: configs/paper_reduced100/stage_r_localno_p3_residual_plain.yaml

data:
  dataset: data_proc/grmhd_regrid_inner_r200_64_expanded.h5
  dataset_sha256: 3582a5c4f52f4fef305578ffd5a63c51423f8583f35d137c288d5c20203b50da
  split: artifacts/stage_s/train_val_split.json
  small_pairs: artifacts/stage_s/small_train_pairs.txt
