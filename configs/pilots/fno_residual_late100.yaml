base_config: ../data/late100.yaml

experiment_name: pilot_fno_residual_late100
model:
  type: fno
  predict_residual: true
training:
  epochs: 20
  batch_size: 1
  gradient_accumulation: 4
  learning_rate: 1.0e-3
  warmup_epochs: 5
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  early_stopping_patience: 20
  mixed_precision: false
