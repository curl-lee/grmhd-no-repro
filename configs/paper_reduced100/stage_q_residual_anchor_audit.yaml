schema_version: paper-stage-q-residual-anchor-audit-v1
classification: no_training_output_contract_audit

contract:
  formula: y_alpha = z + alpha * (F(z, shells) - z)
  scalar_alpha_only: true
  alpha_grid: [0.0, 0.125, 0.25, 0.5, 1.0]
  candidate_alphas: [0.125, 0.25, 0.5]
  controls:
    persistence: 0.0
    stage_o_direct: 1.0
  identity_tolerance:
    mode: dtype_epsilon_scaled
    ulp_factor: 8
    unit_floor: 1.0
  forbidden_operations:
    - channel_specific_alpha
    - shell_specific_alpha
    - learned_or_adaptive_alpha
    - normalized_clipping
    - physical_clipping
    - residual_clipping_or_renormalization

data:
  train_snapshots: [11, 90]
  train_transitions: 79
  validation_snapshots: [91, 110]
  validation_transitions: 19
  validation_used_for_selection: false

readiness:
  engineering:
    require_all_finite: true
    require_rho_press_positive: true
    allow_transform_counter_error: false
    allow_new_nonfinite_decoder_derivative: false
  overshoot_reduction:
    q001_q999_ood_fraction_reduction_min: 0.75
    rout_failure_count_reduction_min: 0.75
  persistence_bound:
    normalized_average_ratio_max: 1.05
  nontrivial_dynamics:
    median_residual_over_true_residual_min: 0.05
    positive_residual_cosine_channels_min: 4
    persistence_equivalence_atol: 1.0e-7
    persistence_equivalence_rtol: 1.0e-6
  structure:
    gate_2_severe_count_reduction_min: 0.50
    require_shell_or_radial_not_worse_than_persistence: true
    allow_new_persistent_range_failure: false
  control_channels:
    names: [Bcc1, rho, press, vel1, vel2]
    relative_error_worsening_threshold: 0.20
    worsened_channel_count_max: 2

selection:
  primary: lowest_train_normalized_average
  within_relative_fraction: 0.01
  within_one_percent_choose_larger_alpha: true
  final_tie_order: [0.5, 0.25, 0.125]
  validation_may_change_selection: false

limits:
  fixed_state_applications_max: 2
  counterfactual_rollout_steps_max: 19
  prediction_decodes_if_rollout: 19
  next_input_encodes_if_rollout: 19
  local_gain_epsilons: [0.001, 0.01]
  local_gain_epsilon_consistency_relative: 0.20

