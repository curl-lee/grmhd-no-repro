baselines:
  stage_t_metrics: artifacts/stage_t/full_long/checkpoint_metrics_epoch_0150.json
  stage_t_rollout: artifacts/stage_t/full_long/rollout/epoch_0150_rollout.json
  stage_ad_metrics: artifacts/stage_ad/training/disco3d_localno/one_step_metrics.json
