  inner: [0, 21]
  middle: [21, 42]
  outer: [42, 64]

gates:
  state_retention_factor: 1.05
  shell_skill_minimum_delta: 0.10
  radial_skill_minimum_delta: 0.10
  rollout_minimum_first_10x_step_exclusive: 1
  rollout_strong_first_10x_step_exclusive: 3
